<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GoComics Political</title>
    <style>
        /* Variabili per i Temi */
        :root {
            --bg-color: #f4f4f9;
            --card-bg: #ffffff;
            --text-color: #333333;
            --accent-color: #007bff;
            --border-color: #dddddd;
            --star-color: #ccc;
            --star-active: #ffc107;
        }

        [data-theme="dark"] {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #e0e0e0;
            --accent-color: #4dabff;
            --border-color: #333333;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            transition: background-color 0.3s, color 0.3s;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            width: 100%;
            max-width: 800px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .controls {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        a, a:visited, a:hover, a:active {
            color: inherit;
            text-decoration: none;
        }

        button {
            padding: 8px 15px;
            cursor: pointer;
            border-radius: 5px;
            border: 1px solid var(--border-color);
            background: var(--card-bg);
            color: var(--text-color);
        }

        .page-selector {
            display: flex;
            gap: 5px;
        }

        .page-selector a {
            padding: 8px 15px;
            border-radius: 5px;
            border: 1px solid var(--border-color);
            background: var(--card-bg);
            color: var(--text-color);
            cursor: pointer;
        }

        .page-selector a.active {
            background: var(--accent-color);
            color: #fff;
            border-color: var(--accent-color);
        }

        #comic-container {
            width: 100%;
            max-width: 800px;
        }

        .comic-card {
            background: var(--card-bg);
            margin-bottom: 30px;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            text-align: center;
            border: 1px solid var(--border-color);
        }

        .card-header {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            margin-bottom: 15px;
        }

        .comic-slug {
            font-weight: bold;
            font-size: 1.3rem;
            color: var(--accent-color);
            text-transform: uppercase;
        }

        .fav-btn {
            background: none;
            border: none;
            font-size: 1.5rem;
            color: var(--star-color);
            cursor: pointer;
            transition: transform 0.2s;
            padding: 0;
        }

        .fav-btn.active { color: var(--star-active); }
        .fav-btn:hover { transform: scale(1.2); }

        .ban-btn {
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            transition: transform 0.2s;
            padding: 0;
            opacity: 0.3;
        }

        .ban-btn:hover { transform: scale(1.2); opacity: 1; }

        #footer {
            width: 100%;
            max-width: 800px;
            text-align: center;
            margin: 10px 0 30px;
        }

        .comic-image {
            max-width: 100%;
            height: auto;
            border-radius: 4px;
        }

        .status-msg { margin: 20px; font-style: italic; opacity: 0.7; }
    </style>
</head>
<body data-theme="light">

    <header>
        <h1>GoComics Political</h1>
        <div class="controls">
            <div class="page-selector">
                <a href="comics.html">All</a>
                <a href="political.html" class="active">Political</a>
            </div>
            <button onclick="toggleDarkMode()">🌓 Tema</button>
        </div>
    </header>

    <div id="status" class="status-msg">Inizializzazione...</div>
    <div id="comic-container"></div>
    <div id="footer"></div>

    <script>
        const API_ASSET_BASE = 'https://www.gocomics.com/api/service/v2/assets/recent/';

        const TODAY = new Date();
        // Fino alle 10 UTC mostra i fumetti del giorno precedente; dalle 10 UTC quelli di oggi
        const BEFORE_10_UTC = TODAY.getUTCHours() < 10;
        const VIEW_DATE = new Date(TODAY);
        VIEW_DATE.setDate(TODAY.getDate() - (BEFORE_10_UTC ? 1 : 0));
        VIEW_DATE.setHours(0, 0, 0, 0); // Mezzanotte locale del giorno di riferimento
        const VIEW_END = new Date(VIEW_DATE);
        VIEW_END.setDate(VIEW_END.getDate() + 1); // Fine del giorno di riferimento

        // Embedded political comics list (deduplicated)
        const POLITICAL_SLUGS = [...new Set(`algoodwyn
bill-bramhall
bobgorrell
brian-mcfadden
chipbok
chrisbritt
claybennett
clayjones
danasummers
doonesbury
drewsheneman
eric-allie
garymarkstein
garyvarvel
henrypayne
jackohman
jeffdanziger
jeffstahler
jen-sorensen
jimmorin
joe-heller
joelpett
joey-weatherford
johndeering
kal
kevin-necessary-editorial-cartoons
laloalcaraz
lisabenson
m2bulls
marshallramsey
matt-bors
mattdavies
mattwuerker
michaelramirez
mike-beckom
mike-lester
mikeluckovich
nickanderson
patoliphant
pedroxmolina
phil-hands
rebecca-hendin
robert-ariail
robrogers
scottstantis
stevebenson
stevebreen
stevekelley
ted-rall
think
tim-campbell
tomthedancingbug
tomtoles
two-party-opera
viewsafrica
viewsamerica
viewsasia
viewsbusiness
viewseurope
viewslatinamerica
viewsmideast
viewsoftheworld
walthandelsman
political-cartoons`.trim().split('\n').map(s => s.trim()).filter(Boolean))];

        let favorites = JSON.parse(localStorage.getItem('comic-favs')) || [];
        let blacklist = JSON.parse(localStorage.getItem('comic-blacklist')) || [];

        if (localStorage.getItem('theme') === 'dark') {
            document.body.setAttribute('data-theme', 'dark');
        }

        function toggleDarkMode() {
            const current = document.body.getAttribute('data-theme');
            const next = current === 'light' ? 'dark' : 'light';
            document.body.setAttribute('data-theme', next);
            localStorage.setItem('theme', next);
        }

        function banComic(slug, cardElement) {
            blacklist.push(slug);
            localStorage.setItem('comic-blacklist', JSON.stringify(blacklist));
            cardElement.remove();
        }

        function clearBlacklist() {
            blacklist = [];
            localStorage.removeItem('comic-blacklist');
            location.reload();
        }

        function toggleFavorite(slug, btnElement) {
            if (favorites.includes(slug)) {
                favorites = favorites.filter(s => s !== slug);
                btnElement.classList.remove('active');
            } else {
                favorites.push(slug);
                btnElement.classList.add('active');
            }
            localStorage.setItem('comic-favs', JSON.stringify(favorites));
        }

        const MAX_CONCURRENT = 12;

        async function fetchWithConcurrency(items, limit, fn) {
            const results = new Array(items.length);
            let next = 0;
            async function worker() {
                while (next < items.length) {
                    const i = next++;
                    results[i] = await fn(items[i]);
                }
            }
            await Promise.all(Array.from({ length: Math.min(limit, items.length) }, () => worker()));
            return results;
        }

        function renderComicCard(slug, asset, container) {
            const isFav = favorites.includes(slug);
            const card = document.createElement('div');
            card.className = 'comic-card';
            card.innerHTML = `
                <div class="card-header">
                    <button class="fav-btn ${isFav ? 'active' : ''}"
                            onclick="toggleFavorite('${slug}', this)">★</button>
                    <span class="comic-slug"><a href='artist.html?slug=${slug}' target="_blank">${slug}</a></span>
                    <button class="ban-btn" onclick="banComic('${slug}', this.closest('.comic-card'))" title="Escludi">🚫</button>
                </div>
                <div style="font-size: 0.8rem; color: #888; margin-bottom: 8px;">Data Originale: ${new Date(asset.originalDate).toLocaleDateString()}</div>
                <img class="comic-image" src="${asset.url}" alt="${slug}" loading="lazy">
            `;
            container.appendChild(card);
        }

        async function init() {
            const container = document.getElementById('comic-container');
            const status = document.getElementById('status');

            // Sort: favorites first, then alphabetical (excluding blacklisted)
            const slugs = [...POLITICAL_SLUGS].filter(s => !blacklist.includes(s)).sort((a, b) => a.localeCompare(b));
            slugs.sort((a, b) => {
                const aFav = favorites.includes(a);
                const bFav = favorites.includes(b);
                return (aFav === bFav) ? 0 : aFav ? -1 : 1;
            });

            const DAY_LABEL = BEFORE_10_UTC ? ' (giorno precedente)' : '';
            let loaded = 0;
            status.innerText = `Caricamento fumetti politici${DAY_LABEL}: 0/${slugs.length}...`;

            try {
                // Caricamento parallelo con limite di concorrenza
                const assetsBySlug = await fetchWithConcurrency(slugs, MAX_CONCURRENT, async (slug) => {
                    try {
                        const res = await fetch(`${API_ASSET_BASE}${slug}`);
                        if (!res.ok) return null;
                        return await res.json();
                    } catch (err) {
                        return null;
                    } finally {
                        loaded++;
                        status.innerText = `Caricamento fumetti politici${DAY_LABEL}: ${loaded}/${slugs.length}...`;
                    }
                });

                // Render in ordine (preferiti in alto, poi alfabetico)
                assetsBySlug.forEach((assets, i) => {
                    if (!assets || assets.length === 0) return;
                    const asset = assets[0];
                    const assetDate = new Date(asset.originalDate);
                    if (asset.isRerun || assetDate < VIEW_DATE || assetDate >= VIEW_END) return;
                    renderComicCard(slugs[i], asset, container);
                });

                status.innerText = "Feed aggiornato.";
                if (blacklist.length > 0) {
                    document.getElementById('footer').innerHTML =
                        `<button onclick="clearBlacklist()">↩ Riammetti tutti gli esclusi (${blacklist.length})</button>`;
                }
            } catch (error) {
                status.innerText = "Errore di caricamento.";
            }
        }

        init();
    </script>
</body>
</html>
